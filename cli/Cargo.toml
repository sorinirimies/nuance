[package]
name        = "nuance-cli"
version     = "0.1.0"
edition     = "2021"
authors     = ["Sorin Irimies <sorinirimies@gmail.com>"]
license     = "MIT"
repository  = "https://github.com/sorinirimies/nuance"
description = "Install-free CLI + ratatui TUI for nuance — the themeable, git-aware Nushell prompt. `cargo install nuance-cli` gives you `nuance`, with a live-preview theme/style/look picker, usable from any shell."
categories  = ["command-line-utilities"]
keywords    = ["nushell", "prompt", "theme", "cli", "shell"]
readme      = "README.md"
exclude     = ["target/"]

[[bin]]
name = "nuance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"
