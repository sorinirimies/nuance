[package]
name = "nuance-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ratatui = "0.30.2"

# ratatui is used by ../src/ansi.rs, which the target includes with #[path];
# cargo machete does not follow #[path], so it would call it unused.
[package.metadata.cargo-machete]
ignored = ["ratatui"]

[[bin]]
name = "ansi_parse"
path = "fuzz_targets/ansi_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nu_quote"
path = "fuzz_targets/nu_quote.rs"
test = false
doc = false
bench = false

[workspace]
