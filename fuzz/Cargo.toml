[package]
name = "nuance-cli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "ansi_parse"
path = "fuzz_targets/ansi_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nu_quote"
path = "fuzz_targets/nu_quote.rs"
test = false
doc = false
bench = false

[workspace]
