name: Nightly Dependency Upgrade

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      incompatible:
        description: "Also take semver-incompatible (major) upgrades"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Job-level so the `if:` of the mirror-push step can see it (a step's own
  # `env:` is not visible to that same step's `if:`, which silently skipped it).
  GITHUB_REMOTE_URL: ${{ secrets.GITHUB_REMOTE_URL }}

concurrency:
  group: deps-update
  cancel-in-progress: true

jobs:
  upgrade-deps:
    name: Upgrade Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      # `cargo upgrade` (cargo-edit) rewrites the version requirements in
      # Cargo.toml. Plain `cargo update` only moves Cargo.lock inside the
      # existing requirements, which never reaches `cargo install` users.
      - name: Install cargo-edit (cargo upgrade)
        run: cargo install cargo-edit --locked

      - name: Install Nushell (test-nu / scripts/install.nu need it)
        run: |
          set -euo pipefail
          url="https://github.com/nushell/nushell/releases/download/0.114.1/nu-0.114.1-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/nu.tar.gz
          mkdir -p /tmp/nu-extract
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu-extract
          bin="$(find /tmp/nu-extract -type f -name nu | head -1)"
          mkdir -p "$HOME/.local/bin"
          cp "$bin" "$HOME/.local/bin/nu"
          chmod +x "$HOME/.local/bin/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Manifest + lockfile as committed on main, to tell later whether a
      # *direct* dependency really moved (vs. transitive-only churn).
      - name: Snapshot committed Cargo.lock (release gate)
        run: git show HEAD:Cargo.lock > "$RUNNER_TEMP/Cargo.lock.head"

      # Upgrade Cargo.toml requirements AND the lockfile. Majors are tried
      # first (default; disable via the workflow_dispatch input). If the
      # quality gate then fails, roll back and retry with compatible-only
      # upgrades so one breaking major doesn't block every other update.
      - name: Upgrade dependencies (Cargo.toml + Cargo.lock)
        id: upgrade
        shell: bash
        run: |
          set -uo pipefail
          want_major="${{ github.event.inputs.incompatible }}"
          want_major="${want_major:-true}"

          upgrade() {
            if [ "$1" = "major" ]; then
              cargo upgrade --incompatible allow
            else
              cargo upgrade
            fi
            cargo update
          }

          mode=compatible
          [ "$want_major" = "true" ] && mode=major

          upgrade "$mode"
          if git diff --quiet Cargo.toml Cargo.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! just check-all; then
            if [ "$mode" = "major" ]; then
              echo "::warning::Major upgrades failed the quality gate - retrying compatible-only."
              git checkout -- Cargo.toml Cargo.lock
              upgrade compatible
              if git diff --quiet Cargo.toml Cargo.lock; then
                echo "has_changes=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              just check-all || exit 1
              mode=compatible
            else
              exit 1
            fi
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      # Release only if a direct dependency really moved: its requirement in
      # Cargo.toml changed, or its locked version changed in Cargo.lock.
      # Transitive-only lock churn is committed but never released.
      - name: Check for direct dependency changes
        id: direct
        if: steps.upgrade.outputs.has_changes == 'true'
        run: |
          if git diff --quiet Cargo.toml; then
            echo "release=$(nu scripts/direct_deps_changed.nu --before "$RUNNER_TEMP/Cargo.lock.head" --after Cargo.lock)" >> "$GITHUB_OUTPUT"
          else
            echo "Cargo.toml requirements changed:" >&2
            git diff -U0 Cargo.toml | grep -E '^[-+][a-z]' >&2 || true
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push dependency update
        if: steps.upgrade.outputs.has_changes == 'true'
        run: |
          DATE=$(date -u '+%Y-%m-%d')

          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"

          BODY="$(git diff -U0 Cargo.toml | grep -E '^[-+][a-z]' || true)"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(deps): nightly dependency upgrade $DATE" -m "$BODY"
          git push origin main

          echo "✅ Dependency update pushed to main."

      # ── Bump patch version, tag, and push to Gitea + GitHub ─────────────────
      # `just bump` runs its own quality gate again, edits Cargo.toml, updates
      # Cargo.lock, commits, and tags -- it does not push (see justfile).
      - name: Compute next patch version
        if: steps.upgrade.outputs.has_changes == 'true' && steps.direct.outputs.release == 'true'
        id: version
        run: |
          current="$(just version)"
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump version, commit and tag
        if: steps.upgrade.outputs.has_changes == 'true' && steps.direct.outputs.release == 'true'
        run: just bump ${{ steps.version.outputs.next }}

      - name: Push release commit and tag to Gitea
        if: steps.upgrade.outputs.has_changes == 'true' && steps.direct.outputs.release == 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.next }}"

      - name: Push release commit and tag to GitHub mirror
        if: steps.upgrade.outputs.has_changes == 'true' && steps.direct.outputs.release == 'true' && env.GITHUB_REMOTE_URL != ''
        run: |
          git remote add github-ci "$GITHUB_REMOTE_URL"
          git push github-ci HEAD:${{ github.ref_name }}
          git push github-ci "v${{ steps.version.outputs.next }}"

      - name: Transitive-only update — no release
        if: steps.upgrade.outputs.has_changes == 'true' && steps.direct.outputs.release != 'true'
        run: echo "ℹ️ Only transitive deps changed — lockfile committed, release skipped."

      - name: Nothing to update
        if: steps.upgrade.outputs.has_changes == 'false'
        run: echo "✅ All dependencies already up to date — nothing to upgrade."
