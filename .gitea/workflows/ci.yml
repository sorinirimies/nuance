name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Gitea's runner here only has an ubuntu-latest label (no macos-latest) —
# unlike .github/workflows/ci.yml (GitHub-hosted, has real macOS runners),
# this file is ubuntu-only. Gitea Actions reads .gitea/workflows/ instead
# of .github/workflows/ when both exist.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  cli-tests:
    name: cargo test (nuance-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked

      - name: Install Nushell (needed by nuance's own tests)
        run: |
          set -euo pipefail
          url="https://github.com/nushell/nushell/releases/download/0.114.1/nu-0.114.1-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/nu.tar.gz
          mkdir -p /tmp/nu-extract
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu-extract
          bin="$(find /tmp/nu-extract -type f -name nu | head -1)"
          mkdir -p "$HOME/.local/bin"
          cp "$bin" "$HOME/.local/bin/nu"
          chmod +x "$HOME/.local/bin/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: cargo test --locked

  nushell-suite:
    name: nu test.nu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell
        run: |
          set -euo pipefail
          url="https://github.com/nushell/nushell/releases/download/0.114.1/nu-0.114.1-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" -o /tmp/nu.tar.gz
          mkdir -p /tmp/nu-extract
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu-extract
          bin="$(find /tmp/nu-extract -type f -name nu | head -1)"
          mkdir -p "$HOME/.local/bin"
          cp "$bin" "$HOME/.local/bin/nu"
          chmod +x "$HOME/.local/bin/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Nushell suite
        run: nu test.nu

      - name: Verify install (symlink into autoload)
        run: |
          nu scripts/install.nu
          DIR="$(nu -n -c '$nu.user-autoload-dirs | get 0')"
          test -e "$DIR/nushell-prompt.nu" && echo "✓ installed at $DIR/nushell-prompt.nu"
