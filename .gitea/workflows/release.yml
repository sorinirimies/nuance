name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# ubuntu-latest only — this Gitea runner has no macos-latest label.
# The GitHub-hosted release (.github/workflows/release.yml) still builds
# macOS binaries too; this one covers the linux-x86_64 build + a Gitea
# Release, and optionally publishes to crates.io if CRATES_IO_TOKEN is set
# as a Gitea repo secret.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  build:
    name: build and release
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          tar -C target/release -czvf nuance-cli-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz nuance

      - name: Create Gitea Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload release binary
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: nuance-cli-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          asset_name: nuance-cli-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          asset_content_type: application/gzip

      - name: Publish to crates.io
        if: env.CRATES_IO_TOKEN != ''
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --token $CRATES_IO_TOKEN

      - name: Skip crates.io publish
        if: env.CRATES_IO_TOKEN == ''
        run: echo "CRATES_IO_TOKEN not set — add it as a Gitea repo secret to enable auto-publish."
