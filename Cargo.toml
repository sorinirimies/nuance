[package]
name        = "nuance-cli"
version     = "0.2.2"
edition     = "2021"
authors     = ["Sorin Irimies <sorinirimies@gmail.com>"]
license     = "MIT"
repository  = "https://github.com/sorinirimies/nuance"
description = "Install-free CLI + ratatui TUI for nuance — the themeable, git-aware Nushell prompt. `cargo install nuance-cli` gives you `nuance`, with a live-preview theme/style/look picker, usable from any shell."
categories  = ["command-line-utilities"]
keywords    = ["nushell", "prompt", "theme", "cli", "shell"]
readme      = "README.md"
# The crate now lives at the repo root (alongside the Nushell script it
# vendors) instead of a nested cli/ dir — only ship what the binary actually
# needs on crates.io, not the whole repo (docs/, tapes/, scripts/, tests
# fixtures, etc).
include     = ["src/**", "tests/**", "Cargo.toml", "nushell-prompt.nu", "README.md", "LICENSE"]

[[bin]]
name = "nuance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3"
