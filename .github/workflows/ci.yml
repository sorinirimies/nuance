name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nushell:
    name: nushell (${{ matrix.os }}, nu ${{ matrix.nu }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        nu: ["0.111.0", "0.114.1"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nushell ${{ matrix.nu }}
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"; case "$arch" in x86_64|amd64) arch=x86_64 ;; arm64|aarch64) arch=aarch64 ;; esac
          case "$(uname -s)" in Linux) plat=unknown-linux-gnu ;; Darwin) plat=apple-darwin ;; *) echo "unsupported OS"; exit 1 ;; esac
          target="${arch}-${plat}"
          ver="${{ matrix.nu }}"
          url="https://github.com/nushell/nushell/releases/download/${ver}/nu-${ver}-${target}.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o /tmp/nu.tar.gz
          mkdir -p /tmp/nu-extract
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu-extract
          bin="$(find /tmp/nu-extract -type f -name nu | head -1)"
          mkdir -p "$HOME/.local/bin"
          cp "$bin" "$HOME/.local/bin/nu"
          chmod +x "$HOME/.local/bin/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nu" --version

      - name: Nushell suite
        shell: bash
        run: nu test.nu

      - name: Verify install (symlink into autoload)
        shell: bash
        run: |
          nu scripts/install.nu
          DIR="$(nu -n -c '$nu.user-autoload-dirs | get 0')"
          test -e "$DIR/nushell-prompt.nu" && echo "✓ installed at $DIR/nushell-prompt.nu"

  cli:
    name: nuance-cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Install Nushell (needed by nuance's own tests)
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"; case "$arch" in x86_64|amd64) arch=x86_64 ;; arm64|aarch64) arch=aarch64 ;; esac
          case "$(uname -s)" in Linux) plat=unknown-linux-gnu ;; Darwin) plat=apple-darwin ;; *) echo "unsupported OS"; exit 1 ;; esac
          target="${arch}-${plat}"
          ver="0.114.1"
          url="https://github.com/nushell/nushell/releases/download/${ver}/nu-${ver}-${target}.tar.gz"
          echo "fetching $url"
          curl -fsSL "$url" -o /tmp/nu.tar.gz
          mkdir -p /tmp/nu-extract
          tar -xzf /tmp/nu.tar.gz -C /tmp/nu-extract
          bin="$(find /tmp/nu-extract -type f -name nu | head -1)"
          mkdir -p "$HOME/.local/bin"
          cp "$bin" "$HOME/.local/bin/nu"
          chmod +x "$HOME/.local/bin/nu"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nu" --version

      - name: Unit + integration tests
        run: cargo test --locked

      - name: Smoke test (install + set theme/style/look via cargo-built CLI)
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/nuance-cli-home"
          mkdir -p "$HOME"
          BIN=target/debug/nuance
          "$BIN" help | grep -q 'nuance theme'
          "$BIN" theme gruvbox | grep -q gruvbox
          "$BIN" prompt-style powerline | grep -q powerline
          "$BIN" look cyberpunk | grep -q cyberpunk
          CFG="$(HOME="$HOME" nu -n -c '$nu.default-config-dir')"
          [ "$(cat "$CFG/current-theme.txt")" = "cyberpunk" ]
          echo "✓ nuance-cli smoke test passed"
